# Nixpacks configuration for Railway.
# Forces Node 20 LTS (Next 16 minimum), pins the install/build/start commands.
# https://nixpacks.com/docs/configuration

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
